name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fail fast on unformatted code, lints and tests. No third-party actions beyond
# the official checkout: the GitHub Linux runners already ship a Rust toolchain,
# and rustup honours our rust-toolchain.toml.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Release build
        run: cargo build --release
